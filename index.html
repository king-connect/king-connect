<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KINGConnect ELITE v33</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: #fff; color: #000; height: 100vh; display: flex; overflow: hidden; }

        /* Tela de Autenticação - Tema Escuro (Fundo #121212) */
        #tela-login { position: fixed; inset: 0; background: #121212; z-index: 5000; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
        .login-box { width: 100%; max-width: 320px; text-align: center; }
        .login-box h2 { color: #fff; font-size: 24px; font-weight: bold; margin-bottom: 25px; letter-spacing: 1px; }
        
        /* Inputs Estilo Capsula Arredondada */
        .input-login { width: 100%; padding: 14px 20px; margin: 8px 0; border: none; border-radius: 30px; background: #e8f0fe; color: #000; font-weight: bold; text-align: center; font-size: 15px; outline: none; }
        .input-login::placeholder { color: #757575; font-weight: bold; }
        
        /* Botão Arredondado Branco */
        .btn-login { width: auto; min-width: 140px; padding: 10px 30px; margin-top: 15px; background: #fff; color: #000; border: none; border-radius: 30px; font-weight: bold; font-size: 14px; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
        .btn-login:active { transform: scale(0.98); opacity: 0.9; }

        /* Nav Sidebar / Mobile Bottom Nav */
        #sidebar { width: 80px; background: #000; display: flex; flex-direction: column; align-items: center; padding-top: 20px; gap: 25px; flex-shrink: 0; z-index: 100; }
        @media (max-width: 600px) {
            #sidebar { width: 100%; height: 60px; position: fixed; bottom: 0; flex-direction: row; justify-content: space-around; padding: 0; border-top: 1px solid #eee; background: #000; }
        }
        .nav-btn { cursor: pointer; color: #fff; opacity: 0.6; text-align: center; font-size: 11px; transition: 0.3s; }
        .nav-btn.active { opacity: 1; border-bottom: 2px solid #fff; padding-bottom: 5px; }
        .nav-btn img { width: 24px; filter: invert(1); display: block; margin: 0 auto 5px; }

        /* Main Content Area */
        .main { flex: 1; display: flex; flex-direction: column; background: #fff; position: relative; overflow: hidden; }
        header { background: #000; color: #fff; padding: 15px; display: flex; justify-content: space-between; align-items: center; font-weight: bold; height: 60px; }
        .content { flex: 1; overflow-y: auto; padding-bottom: 80px; }
        .aba { display: none; width: 100%; height: 100%; }
        .aba.active { display: block; }

        /* Post Card Styles */
        .post-card { max-width: 350px; margin: 12px auto; border: 1px solid #eee; border-radius: 12px; background: #fff; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .media-container { width: 100%; background: #000; position: relative; min-height: 200px; display: flex; justify-content: center; align-items: center; }
        .post-media { max-width: 100%; max-height: 380px; display: block; }

        /* Profile Grid */
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 8px; }
        .grid-item { aspect-ratio: 1/1; cursor: pointer; background: #000; overflow: hidden; position: relative; border-radius: 4px; }
        .grid-item img, .grid-item video { width: 100%; height: 100%; object-fit: cover; }
        .btn-capa-edit { position: absolute; top: 5px; right: 5px; background: rgba(0,0,0,0.7); color: #fff; font-size: 9px; padding: 3px 6px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.3); z-index: 10; font-weight: bold; }

        /* Floating Action Button & Modals */
        .fab { position: absolute; bottom: 85px; right: 20px; width: 55px; height: 55px; background: #000; color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; cursor: pointer; z-index: 90; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal-box { background: #fff; padding: 20px; border-radius: 12px; width: 100%; max-width: 400px; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 8px; outline: none; }
        
        /* Chat UI */
        #janela-chat { position: absolute; inset: 0; background: #fff; z-index: 200; display: none; flex-direction: column; }
        #chat-msgs { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 8px; }
        .m { padding: 10px 15px; border-radius: 18px; max-width: 75%; font-size: 14px; }
        .m.me { align-self: flex-end; background: #000; color: #fff; }
        .m.him { align-self: flex-start; background: #f1f1f1; color: #000; }

        /* Progress Bar */
        #progresso-container { display: none; width: 100%; background: #eee; border-radius: 8px; margin: 10px 0; overflow: hidden; }
        #barra-progresso { width: 0%; height: 10px; background: #000; transition: 0.2s; }
    </style>
</head>
<body>

    <div id="tela-login">
        <div class="login-box">
            <h2>KING LOGIN</h2>
            
            <div id="box-login">
                <input type="text" id="user-id" class="input-login" placeholder="Usuário">
                <input type="password" id="user-pass" class="input-login" placeholder="••••••">
                <button onclick="fazerLogin()" class="btn-login">ENTRAR</button>
                <p style="margin-top:25px; font-size:13px; color:#aaa;">Novo aqui? <a href="#" onclick="toggleAuth('cadastro')" style="color:#fff; font-weight:bold; text-decoration:none;">Criar conta</a></p>
                <p onclick="toggleAuth('recuperar')" style="font-size:12px; margin-top:15px; cursor:pointer; color:#757575;">Esqueceu a senha?</p>
            </div>

            <div id="box-cadastro" style="display:none;">
                <input type="text" id="reg-id" class="input-login" placeholder="@usuario">
                <input type="text" id="reg-nome" class="input-login" placeholder="Nome Real">
                <input type="password" id="reg-pass" class="input-login" placeholder="Senha">
                <button onclick="fazerCadastro()" class="btn-login">CADASTRAR</button>
                <p onclick="toggleAuth('login')" style="margin-top:20px; cursor:pointer; color:#aaa; font-size:13px;">Voltar para o Login</p>
            </div>

            <div id="box-recuperar" style="display:none;">
                <input type="text" id="rec-id" class="input-login" placeholder="@usuario">
                <input type="text" id="rec-nome" class="input-login" placeholder="Nome Real Exato">
                <button onclick="recuperarConta()" class="btn-login">RECUPERAR</button>
                <p onclick="toggleAuth('login')" style="margin-top:20px; cursor:pointer; color:#aaa; font-size:13px;">Voltar para o Login</p>
            </div>
        </div>
    </div>

    <div id="sidebar" style="display:none;">
        <div class="nav-btn" id="btn-chat" onclick="switchTab('chat')"><img src="https://cdn-icons-png.flaticon.com/512/1380/1380338.png">Chat</div>
        <div class="nav-btn" id="btn-busca" onclick="switchTab('busca')"><img src="https://cdn-icons-png.flaticon.com/512/622/622669.png">Busca</div>
        <div class="nav-btn active" id="btn-feed" onclick="switchTab('feed')"><img src="https://cdn-icons-png.flaticon.com/512/1077/1077035.png">Feed</div>
        <div class="nav-btn" id="btn-perfil" onclick="switchTab('perfil')"><img src="https://cdn-icons-png.flaticon.com/512/1077/1077063.png">Perfil</div>
    </div>

    <div class="main">
        <header><b>KINGCONNECT</b> <img src="https://cdn-icons-png.flaticon.com/512/3524/3524659.png" onclick="abrirConfig()" style="width:20px; filter:invert(1); cursor:pointer;"></header>

        <div id="aba-feed" class="aba active content"></div>
        
        <div id="aba-perfil" class="aba content">
            <div style="text-align:center; padding:20px; border-bottom:1px solid #eee;">
                <img id="view-foto" src="" style="width:80px; height:80px; border-radius:50%; object-fit:cover; border:2px solid #000;">
                <h2 id="view-nome">...</h2>
                <p id="view-at" style="color:#888;">@...</p>
                <button onclick="abrirEdit()" style="margin-top:10px; padding:6px 15px; border-radius:20px; border:1px solid #ddd; background:none; font-size:11px;">Editar Perfil</button>
            </div>
            <div id="p-grid" class="grid"></div>
        </div>

        <div id="aba-detalhes" class="aba content">
            <div onclick="switchTab('perfil')" style="padding:15px; font-weight:bold; cursor:pointer; border-bottom:1px solid #eee;">⬅ VOLTAR</div>
            <div id="lista-detalhes"></div>
        </div>

        <div id="aba-busca" class="aba content">
            <div style="padding:15px;"><input type="text" id="input-busca" placeholder="Pesquisar @..." onkeyup="buscarReal()"></div>
            <div id="resultados-busca"></div>
        </div>

        <div id="aba-chat" class="aba content">
            <div id="lista-conversas"></div>
            <div id="janela-chat">
                <header style="background:#fff; color:#000; border-bottom:1px solid #eee; display:flex; align-items:center; padding:0 15px; height:60px;">
                    <span onclick="fecharChat()" style="cursor:pointer; font-size:20px;">⬅</span>
                    <b id="chat-nome-titulo" style="margin-left:15px;">...</b>
                </header>
                <div id="chat-msgs"></div>
                <div style="padding:15px; display:flex; gap:10px; border-top:1px solid #eee;">
                    <input type="text" id="msg-input" placeholder="Mensagem..." style="margin:0; flex:1;">
                    <button onclick="enviarMsg()" style="background:#000; color:#fff; border:none; padding:0 15px; border-radius:8px; cursor:pointer;">Enviar</button>
                </div>
            </div>
        </div>

        <button class="fab" onclick="abrirUpload()">+</button>
    </div>

    <div id="modal-post" class="modal"><div class="modal-box">
        <h3>Postar</h3>
        <p style="font-size:10px; margin-top:10px;">Arquivo Principal:</p>
        <input type="file" id="post-file-main" accept="image/*,video/*" onchange="converte(this, 'midia')">
        <p style="font-size:10px;">Capa do Perfil (Opcional):</p>
        <input type="file" id="post-file-capa" accept="image/*" onchange="converte(this, 'capa')">
        <textarea id="post-legenda" placeholder="O que está pensando?"></textarea>
        
        <div id="progresso-container">
            <div id="barra-progresso"></div>
            <p id="texto-progresso" style="font-size:10px; text-align:center; margin-top:5px;">0%</p>
        </div>

        <button id="btn-publicar" onclick="enviarPost()" style="width:100%; padding:14px; background:#000; color:#fff; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">PUBLICAR</button>
        <p id="btn-cancelar-post" onclick="fecharModais()" style="text-align:center; color:red; margin-top:15px; cursor:pointer;">Cancelar</p>
    </div></div>

    <div id="modal-edit" class="modal"><div class="modal-box">
        <h3>Editar Perfil</h3>
        <input type="text" id="edit-nome" placeholder="Novo Nome">
        <input type="file" accept="image/*" onchange="converte(this, 'perfil-foto')">
        <button onclick="salvarPerfil()" style="width:100%; padding:14px; background:#000; color:#fff; border:none; border-radius:8px; cursor:pointer;">SALVAR</button>
        <p onclick="fecharModais()" style="text-align:center; margin-top:15px; cursor:pointer;">Fechar</p>
    </div></div>

    <div id="modal-config" class="modal"><div class="modal-box" style="text-align:center;">
        <button onclick="sair()" style="width:100%; padding:14px; background:red; color:#fff; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">SAIR DA CONTA</button>
        <p onclick="fecharModais()" style="margin-top:15px; cursor:pointer;">Fechar</p>
    </div></div>

    <script>
        // CONFIGURAÇÕES FIREBASE
        const firebaseConfig = { 
            apiKey: "AIzaSyD9YUu-ovvkUnB5xRdWKhroDoUsSw3MEXY", 
            databaseURL: "https://king-connect-2026-default-rtdb.firebaseio.com" 
        };
        firebase.initializeApp(firebaseConfig);
        const fb = firebase.database();

        let meuUser = JSON.parse(localStorage.getItem('king_session'));
        let tM = "", tC = "", tP = "", chatAtivo = null;

        // AUTH CONTROL
        function toggleAuth(m) {
            document.getElementById('box-login').style.display = m==='login'||m==='login'?'block':'none';
            document.getElementById('box-cadastro').style.display = m==='cadastro'?'block':'none';
            document.getElementById('box-recuperar').style.display = m==='recuperar'?'block':'none';
            if(m === 'login') {
                document.getElementById('box-login').style.display = 'block';
            }
        }

        function fazerCadastro() {
            const id = document.getElementById('reg-id').value.toLowerCase().trim();
            const nome = document.getElementById('reg-nome').value.trim();
            const pass = document.getElementById('reg-pass').value;
            if(!id || !nome || !pass) return alert("Preencha tudo!");
            fb.ref('usuarios/'+id).set({ id, nome, pass, foto: '' }).then(() => logar({ id, nome, pass, foto: '' }));
        }

        // FUNÇÃO DE LOGIN CORRIGIDA COM TOLERÂNCIA A LETRAS MAIÚSCULAS
        function fazerLogin() {
            const id = document.getElementById('user-id').value.toLowerCase().trim();
            const pass = document.getElementById('user-pass').value;

            if(!id || !pass) return alert("Por favor, preencha os campos!");

            fb.ref('usuarios/'+id).once('value', snap => {
                const u = snap.val();
                if(u && u.pass === pass) {
                    logar(u);
                } else {
                    alert("Usuário ou senha incorretos!");
                }
            }).catch(e => {
                console.error(e);
                alert("Erro ao conectar ao Firebase.");
            });
        }

        function recuperarConta() {
            const id = document.getElementById('rec-id').value.toLowerCase().trim();
            const nome = document.getElementById('rec-nome').value.trim();
            fb.ref('usuarios/'+id).once('value', snap => {
                const u = snap.val();
                if(u && u.nome.toLowerCase() === nome.toLowerCase()) { alert("Sua senha é: " + u.pass); logar(u); }
                else alert("Não encontrado!");
            });
        }

        function logar(user) {
            meuUser = user;
            localStorage.setItem('king_session', JSON.stringify(user));
            document.getElementById('tela-login').style.display = 'none';
            document.getElementById('sidebar').style.display = 'flex';
            switchTab('feed');
        }

        function sair() { localStorage.removeItem('king_session'); location.reload(); }

        // NAVIGATION
        function switchTab(t) {
            document.querySelectorAll('.aba').forEach(a => a.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('aba-'+t).classList.add('active');
            if(document.getElementById('btn-'+t)) document.getElementById('btn-'+t).classList.add('active');
            if(t==='feed') carregarFeed();
            if(t==='perfil') carregarPerfil();
            if(t==='chat') carregarConversas();
        }

        // FEED
        function carregarFeed() {
            fb.ref('posts').on('value', snap => {
                const div = document.getElementById('aba-feed'); div.innerHTML = "";
                let posts = [];
                snap.forEach(p => { posts.push({key: p.key, ...p.val()}); });
                posts.reverse().forEach(post => {
                    div.innerHTML += renderPost(post.key, post, post.uid === meuUser.id);
                });
            });
        }

        function renderPost(id, p, meu) {
            return `
            <div class="post-card">
                <div style="padding:10px; font-size:11px; display:flex; justify-content:space-between; align-items:center;">
                    <b>@${p.uid}</b>
                    ${meu ? `<span onclick="apagar('${id}')" style="color:red; cursor:pointer; font-weight:bold;">Remover</span>` : ''}
                </div>
                <div class="media-container">
                    ${p.media.includes('video') ? `<video src="${p.media}" class="post-media" controls></video>` : `<img src="${p.media}" class="post-media">`}
                </div>
                <div style="padding:10px; font-size:13px;"><b>${p.nome}</b> ${p.legenda || ''}</div>
                <div style="padding:10px; border-top:1px solid #eee; display:flex; align-items:center; gap:5px;">
                    <span onclick="like('${id}')" style="cursor:pointer; font-size:16px;">❤️</span> <span style="font-size:12px;">${p.likes || 0}</span>
                </div>
            </div>`;
        }

        // PERFIL
        function carregarPerfil() {
            document.getElementById('view-nome').innerText = meuUser.nome;
            document.getElementById('view-at').innerText = "@" + meuUser.id;
            document.getElementById('view-foto').src = meuUser.foto || 'https://cdn-icons-png.flaticon.com/512/149/149071.png';
            
            fb.ref('posts').once('value', snap => {
                const grid = document.getElementById('p-grid'); grid.innerHTML = "";
                snap.forEach(p => {
                    const post = p.val();
                    if(post.uid === meuUser.id) {
                        const thumb = post.capa || post.media;
                        const isVideo = !post.capa && post.media.includes('video');
                        grid.innerHTML += `
                        <div class="grid-item">
                            <div class="btn-capa-edit" onclick="trocarCapa('${p.key}')">Trocar Capa</div>
                            <div style="width:100%; height:100%" onclick="verDetalhes()">
                                ${isVideo ? `<video src="${thumb}"></video>` : `<img src="${thumb}">`}
                            </div>
                        </div>`;
                    }
                });
            });
        }

        function trocarCapa(key) {
            const input = document.createElement('input');
            input.type = 'file'; input.accept = 'image/*';
            input.onchange = e => {
                const reader = new FileReader();
                reader.onload = ev => { fb.ref('posts/' + key).update({ capa: ev.target.result }).then(() => carregarPerfil()); };
                reader.readAsDataURL(e.target.files[0]);
            };
            input.click();
        }

        function verDetalhes() {
            switchTab('detalhes');
            fb.ref('posts').once('value', snap => {
                const div = document.getElementById('lista-detalhes'); div.innerHTML = "";
                snap.forEach(p => { if(p.val().uid === meuUser.id) div.innerHTML += renderPost(p.key, p.val(), true); });
            });
        }

        // CHAT
        function carregarConversas() {
            fb.ref('conversas/'+meuUser.id).on('value', snap => {
                const d = document.getElementById('lista-conversas'); d.innerHTML = "";
                snap.forEach(c => { d.innerHTML += `<div onclick="abrirChat('${c.key}')" style="padding:15px; border-bottom:1px solid #eee; cursor:pointer;"><b>@${c.key}</b></div>`; });
            });
        }

        function abrirChat(id) {
            chatAtivo = id;
            document.getElementById('janela-chat').style.display = 'flex';
            document.getElementById('chat-nome-titulo').innerText = "@" + id;
            const chatID = meuUser.id < id ? meuUser.id+"_"+id : id+"_"+meuUser.id;
            fb.ref('chats/'+chatID).on('value', snap => {
                const box = document.getElementById('chat-msgs'); box.innerHTML = "";
                snap.forEach(m => {
                    const info = m.val();
                    box.innerHTML += `<div class="m ${info.de === meuUser.id?'me':'him'}">${info.txt}</div>`;
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        function enviarMsg() {
            const input = document.getElementById('msg-input');
            if(!input.value || !chatAtivo) return;
            const chatID = meuUser.id < chatAtivo ? meuUser.id+"_"+chatAtivo : chatAtivo+"_"+meuUser.id;
            fb.ref('chats/'+chatID).push({ de: meuUser.id, txt: input.value });
            fb.ref(`conversas/${meuUser.id}/${chatAtivo}`).set(true);
            fb.ref(`conversas/${chatAtivo}/${meuUser.id}`).set(true);
            input.value = "";
        }

        // UPLOAD E CONVERSÃO
        function converte(input, t) {
            const r = new FileReader();
            r.onload = e => { 
                if(t==='midia') tM = e.target.result; 
                if(t==='capa') tC = e.target.result; 
                if(t==='perfil-foto') tP = e.target.result; 
            };
            if(input.files[0]) r.readAsDataURL(input.files[0]);
        }

        // PROGRESSO CORRIGIDO (NÃO TRAVA EM 99%)
        function enviarPost() {
            if(!tM) return alert("Falta mídia!");

            const btn = document.getElementById('btn-publicar');
            const btnCancel = document.getElementById('btn-cancelar-post');
            const containerProgresso = document.getElementById('progresso-container');
            const barra = document.getElementById('barra-progresso');
            const texto = document.getElementById('texto-progresso');

            btn.disabled = true;
            btn.innerText = "POSTANDO...";
            btnCancel.style.display = "none";
            containerProgresso.style.display = "block";
            
            let progresso = 0;
            const intervalo = setInterval(() => {
                if(progresso < 95) {
                    progresso += Math.floor(Math.random() * 5) + 1;
                } else if (progresso < 99) {
                    progresso += 0.2;
                }
                barra.style.width = progresso + "%";
                texto.innerText = Math.floor(progresso) + "%";
            }, 150);

            fb.ref('posts').push({
                uid: meuUser.id,
                nome: meuUser.nome,
                media: tM,
                capa: tC || "",
                legenda: document.getElementById('post-legenda').value,
                likes: 0,
                data: Date.now()
            }).then(() => {
                clearInterval(intervalo);
                barra.style.width = "100%";
                texto.innerText = "100%";
                setTimeout(() => {
                    resetarModalPost();
                    fecharModais();
                }, 500);
            }).catch(e => {
                clearInterval(intervalo);
                alert("Erro ao postar! Verifique se o arquivo não é muito grande.");
                btn.disabled = false;
                btn.innerText = "PUBLICAR";
                btnCancel.style.display = "block";
            });
        }

        function resetarModalPost() {
            tM = ""; tC = "";
            document.getElementById('post-legenda').value = "";
            document.getElementById('btn-publicar').disabled = false;
            document.getElementById('btn-publicar').innerText = "PUBLICAR";
            document.getElementById('btn-cancelar-post').style.display = "block";
            document.getElementById('progresso-container').style.display = "none";
            document.getElementById('barra-progresso').style.width = "0%";
            document.getElementById('texto-progresso').innerText = "0%";
            document.getElementById('post-file-main').value = "";
            document.getElementById('post-file-capa').value = "";
        }

        // OUTROS
        function salvarPerfil() {
            const n = document.getElementById('edit-nome').value;
            if(n) meuUser.nome = n; if(tP) meuUser.foto = tP;
            fb.ref('usuarios/'+meuUser.id).update(meuUser).then(() => { 
                localStorage.setItem('king_session', JSON.stringify(meuUser)); 
                fecharModais(); 
                carregarPerfil(); 
            });
        }

        function buscarReal() {
            const b = document.getElementById('input-busca').value.toLowerCase();
            const r = document.getElementById('resultados-busca'); r.innerHTML = "";
            if(b.length < 2) return;
            fb.ref('usuarios').once('value', snap => {
                snap.forEach(u => { 
                    if(u.key.includes(b) && u.key !== meuUser.id) 
                        r.innerHTML += `<div onclick="abrirChat('${u.key}'); switchTab('chat')" style="padding:15px; border-bottom:1px solid #eee; cursor:pointer;"><b>@${u.key}</b></div>`; 
                });
            });
        }

        function like(id) { fb.ref('posts/'+id+'/likes').transaction(c => (c || 0) + 1); }
        function apagar(id) { if(confirm("Apagar postagem?")) fb.ref('posts/'+id).remove().then(() => { if(document.getElementById('aba-detalhes').classList.contains('active')) verDetalhes(); }); }
        function abrirUpload() { resetarModalPost(); document.getElementById('modal-post').style.display='flex'; }
        function abrirEdit() { document.getElementById('modal-edit').style.display='flex'; }
        function abrirConfig() { document.getElementById('modal-config').style.display='flex'; }
        function fecharModais() { document.querySelectorAll('.modal').forEach(m => m.style.display='none'); }
        function fecharChat() { document.getElementById('janela-chat').style.display = 'none'; chatAtivo = null; }

        window.onload = () => { if(meuUser) logar(meuUser); };
    </script>
</body>
</html>
